# Per-CPU Darwin PowerPC targets for the fat g3/g4/g5 build (see tls/build.sh).
# Upstream "darwin-ppc" hard-codes "-arch ppc -Wa,-force_cpusubtype_ALL", which
# stamps every slice as generic ppc and stops lipo from merging g4/g5 slices.
#
# AltiVec in OpenSSL's ppc32 asm is chosen at runtime (crypto/ppccap.c reads
# sysctl hw.optional.altivec), so the g3 slice keeps the asm and never runs the
# AltiVec paths on a G3. The g3 assembler needs -force_cpusubtype_ALL to accept
# those instructions, which makes that slice "ppc" (ALL); g4/g5 stay 7400/970.
my %targets = (
    "darwin-ppc-slice" => {
        inherit_from     => [ "darwin-common" ],
        template         => 1,
        cflags           => add("-std=gnu9x"),
        lib_cppflags     => add("-DB_ENDIAN"),
        shared_cflag     => add("-fno-common"),
        asm_arch         => 'ppc32',
        perlasm_scheme   => "osx32",
        disable          => [ "async" ],   # as upstream darwin8-ppc-cc (10.4)
    },
    "darwin-ppc-g3" => {
        inherit_from     => [ "darwin-ppc-slice" ],
        cflags           => add("-arch ppc -mcpu=G3 -mtune=G3 -Wa,-force_cpusubtype_ALL"),
    },
    "darwin-ppc-g4" => {
        inherit_from     => [ "darwin-ppc-slice" ],
        cflags           => add("-arch ppc7400 -mcpu=G4 -mtune=G4 -maltivec"),
    },
    "darwin-ppc-g5" => {
        inherit_from     => [ "darwin-ppc-slice" ],
        cflags           => add("-arch ppc970 -mcpu=G5 -mtune=G5 -maltivec"),
    },
);
